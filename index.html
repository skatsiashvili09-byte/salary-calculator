  <style>
    :root {
      --bg-color: #f8fafc;
      --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #ebf4ff 100%);
      --container-bg: #ffffff;
      --text-color: #0f172a;
      --subtitle-color: #64748b;
      --border-color: #e2e8f0;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --tab-bg: #f1f5f9;
      --tab-text: #475569;
      --tab-active-bg: #2563eb;
      --tab-active-text: #ffffff;
      --result-bg: #f0fdf4;
      --result-border: #bbf7d0;
      --result-text: #166534;
      --ad-bg: #f1f5f9;
      --ad-text: #94a3b8;
      --btn-blue: #2563eb;
      --btn-blue-hover: #1d4ed8;
      --btn-green: #22c55e;
      --btn-green-hover: #16a34a;
      --btn-red: #ef4444;
      --btn-orange: #f97316;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --history-bg: #f8fafc;
    }

    body.dark-mode {
      --bg-color: #0f172a;
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      --container-bg: #1e293b;
      --text-color: #f8fafc;
      --subtitle-color: #94a3b8;
      --border-color: #334155;
      --input-bg: #0f172a;
      --input-border: #475569;
      --tab-bg: #334155;
      --tab-text: #cbd5e1;
      --tab-active-bg: #3b82f6;
      --tab-active-text: #ffffff;
      --result-bg: #064e3b;
      --result-border: #047857;
      --result-text: #d1fae5;
      --ad-bg: #334155;
      --ad-text: #cbd5e1;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      --history-bg: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
    body { font-family: 'Inter', system-ui, -apple-system, sans-serif; background: var(--bg-gradient); color: var(--text-color); padding: 20px; line-height: 1.6; min-height: 100vh;}
    
    .top-controls { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: 0 auto 20px auto; }
    .lang-select { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color); background: var(--container-bg); color: var(--text-color); font-weight: 600; cursor: pointer; outline: none; font-family: 'Inter', sans-serif; box-shadow: var(--shadow);}
    .btn-icon { background: var(--container-bg); border: 1px solid var(--border-color); padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 1.2rem; color: var(--text-color); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);}
    
    .container { max-width: 600px; margin: 0 auto 20px auto; background: var(--container-bg); border-radius: 20px; padding: 28px; box-shadow: var(--shadow); border: 1px solid var(--border-color);}
    h1 { font-size: 1.8rem; font-weight: 800; margin-bottom: 4px; color: var(--text-color); text-align: center; letter-spacing: -0.5px;}
    .subtitle { color: var(--subtitle-color); font-size: 0.95rem; margin-bottom: 24px; text-align: center; font-weight: 500;}
    
    .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
    .tab { flex: 1; min-width: 100px; padding: 12px 8px; border: 1px solid var(--border-color); background: var(--tab-bg); border-radius: 10px; cursor: pointer; font-size: 0.85rem; font-weight: 600; color: var(--tab-text); font-family: 'Inter', sans-serif;}
    .tab.active { background: var(--tab-active-bg); color: var(--tab-active-text); border-color: var(--tab-active-bg); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);}
    
    .direction-toggle { display: flex; justify-content: center; margin-bottom: 20px; }
    .btn-toggle { padding: 10px 20px; border-radius: 30px; border: 1px solid var(--btn-blue); background: transparent; color: var(--btn-blue); font-weight: 600; cursor: pointer; font-size: 0.9rem; font-family: 'Inter', sans-serif;}
    .btn-toggle:hover { background: rgba(37, 99, 235, 0.1); }
    
    label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--subtitle-color); margin-bottom: 8px; }
    .input-row { display: flex; gap: 10px; margin-bottom: 20px; }
    input[type="number"], select { flex: 1; padding: 16px; border: 1.5px solid var(--input-border); border-radius: 12px; font-size: 1.1rem; font-weight: 600; outline: none; width: 100%; background: var(--input-bg); color: var(--text-color); font-family: 'Inter', sans-serif;}
    input[type="number"]:focus, select:focus { border-color: var(--btn-blue); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2); }
    
    .btn-calc { width: 100%; padding: 16px; background: var(--btn-blue); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; margin-bottom: 10px; font-family: 'Inter', sans-serif; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);}
    .btn-calc:hover { background: var(--btn-blue-hover); transform: translateY(-1px); }
    
    .result { margin-top: 24px; padding: 24px; background: var(--result-bg); border: 1.5px solid var(--result-border); border-radius: 16px; display: none; }
    .result.show { display: block; animation: fadeIn 0.4s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .result-total { font-size: 2rem; font-weight: 800; color: var(--result-text); margin-bottom: 20px; text-align: center; letter-spacing: -0.5px;}
    .result-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.95rem; border-bottom: 1px dashed var(--result-border); font-weight: 500;}
    .result-row:last-child { border-bottom: none; }
    .result-row span:last-child { font-weight: 700; }
    
    .chart-container { max-width: 260px; margin: 20px auto; display: none; }
    
    .history-box { margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px; display: none; }
    .history-box.show { display: block; }
    .history-item { background: var(--history-bg); padding: 12px 16px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; border: 1px solid var(--border-color); }
    .btn-save { background: var(--btn-green); color: white; border: none; padding: 14px; border-radius: 12px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 700; font-family: 'Inter', sans-serif; font-size: 0.95rem; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);}
    .btn-clear { background: transparent; color: var(--btn-red); border: 1px solid var(--btn-red); padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; margin-top: 15px; width: 100%; font-weight: 600;}

    .faq-section { margin-top: 30px; }
    .faq-section h2 { font-size: 1.3rem; margin-bottom: 15px; text-align: center; font-weight: 700;}
    details { background: var(--history-bg); padding: 14px 18px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--border-color); cursor: pointer; }
    summary { font-weight: 600; font-size: 1rem; outline: none; }
    details p { margin-top: 12px; font-size: 0.95rem; color: var(--subtitle-color); }

    .note { font-size: 0.85rem; color: var(--subtitle-color); margin-top: 16px; text-align: center; font-weight: 500;}
    .ad-slot { margin-top: 24px; min-height: 100px; background: var(--ad-bg); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--ad-text); font-size: 0.9rem; border: 1px dashed var(--border-color); font-weight: 600;}
    .seo-content { margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 25px; }
    .seo-content h2 { font-size: 1.3rem; margin-bottom: 12px; color: var(--text-color); font-weight: 700;}
    .seo-content p { font-size: 0.95rem; color: var(--subtitle-color); margin-bottom: 15px; }
    .btn-share { display: block; width: 100%; padding: 14px; background: var(--btn-green); color: white; text-align: center; text-decoration: none; border-radius: 12px; font-weight: 700; margin-top: 20px; font-size: 1rem; border: none; cursor: pointer; font-family: 'Inter', sans-serif; box-shadow: 0 4px 12px rgba(34, 197, 94, 0.2);}

    /* Currency Section Styles */
    .currency-section { margin-top: 20px; }
    .currency-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center;}
    .currency-row input { flex: 2; }
    .currency-row select { flex: 1; font-size: 0.95rem; padding: 16px 10px; }
    .currency-result { text-align: center; font-size: 1.5rem; font-weight: 800; color: var(--btn-blue); margin-top: 15px; padding: 15px; background: var(--history-bg); border-radius: 12px; border: 1px solid var(--border-color); display: none;}
    .currency-result.show { display: block; }
  </style>
</head>
<body>
  <div class="top-controls">
    <select class="lang-select" id="langSelect" onchange="changeLanguage(this.value)">
      <option value="ka">🇬🇪 ქართული</option>
      <option value="en">🇬🇧 English</option>
      <option value="ru">🇷🇺 Русский</option>
    </select>
    <button class="btn-icon" id="themeToggle" onclick="toggleTheme()">🌙</button>
  </div>

  <!-- MAIN CALCULATOR -->
  <div class="container">
    <h1 id="t-title">ხელფასის კალკულატორი</h1>
    <p class="subtitle" id="t-subtitle">საქართველო · 2026 წლის გადასახადები</p>

    <div class="tabs">
      <button class="tab active" data-mode="employee" id="t-tab-emp">დაქირავებული</button>
      <button class="tab" data-mode="smallbusiness" id="t-tab-sb">ინდ. მეწარმე (1%)</button>
      <button class="tab" data-mode="employer" id="t-tab-empr">დამსაქმებლის ხარჯი</button>
    </div>

    <div class="direction-toggle">
      <button class="btn-toggle" id="directionBtn">გროსი → ნეტო</button>
    </div>

    <label for="amount" id="t-input-label">შეიყვანე გროს ხელფასი (₾)</label>
    <div class="input-row">
      <input type="number" id="amount" placeholder="2000" min="0" step="10">
    </div>
    <button class="btn-calc" id="t-btn-calc">გამოთვლა</button>

    <div class="result" id="result">
      <div class="result-total" id="resultTotal"></div>
      
      <div class="chart-container" id="chartContainer">
        <canvas id="salaryChart"></canvas>
      </div>

      <div id="resultDetails"></div>
      <button class="btn-save" id="t-save-btn" onclick="saveToHistory()">💾 შენახვა</button>
      <button class="btn-save" style="background: var(--btn-orange); margin-top: 10px; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);" id="t-pdf-btn" onclick="downloadPDF()">📥 PDF-ად გადმოწერა</button>
    </div>

    <div class="history-box" id="historyBox">
      <h3 style="font-size: 1.1rem; margin-bottom: 15px; font-weight: 700;" id="t-history-title">ისტორია</h3>
      <div id="historyList"></div>
      <button class="btn-clear" id="t-clear-btn" onclick="clearHistory()">🗑️ ისტორიის გასუფთავება</button>
    </div>
    
    <p class="note" id="noteText"></p>
  </div>

  <!-- CURRENCY CALCULATOR -->
  <div class="container">
    <h1 id="t-cur-title">ვალუტის კალკულატორი</h1>
    <p class="subtitle" id="t-cur-subtitle">ცოცხალი კურსი (ეროვნული ბანკი)</p>
    
    <div class="currency-section">
      <label id="t-cur-label">შეიყვანე თანხა</label>
      <div class="currency-row">
        <input type="number" id="curAmount" placeholder="100" value="100">
        <select id="curFrom">
          <option value="GEL">GEL (₾)</option>
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="TRY">TRY (₺)</option>
          <option value="RUB">RUB (₽)</option>
        </select>
      </div>
      
      <div style="text-align: center; margin: 10px 0;">
        <span style="font-size: 1.5rem; color: var(--subtitle-color);">⬇️</span>
      </div>
      
      <div class="currency-row">
        <select id="curTo">
          <option value="USD">USD ($)</option>
          <option value="GEL" selected>GEL (₾)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
          <option value="TRY">TRY (₺)</option>
          <option value="RUB">RUB (₽)</option>
        </select>
      </div>
      
      <button class="btn-calc" style="margin-top: 15px; background: var(--btn-orange); box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);" id="t-cur-btn" onclick="convertCurrency()">კონვერტაცია</button>
      
      <div class="currency-result" id="curResult"></div>
    </div>
  </div>

  <!-- SHARE & AD -->
  <div class="container">
    <div class="ad-slot" id="t-ad">📢 რეკლამის ადგილი (AdSense)</div>
    <button class="btn-share" onclick="shareLink()" id="t-share">🔗 გაუზიარე მეგობრებს</button>
  </div>

  <!-- FAQ & SEO -->
  <div class="container">
    <div class="faq-section" id="t-faq-section"></div>
    <div class="seo-content" id="t-seo-content"></div>
  </div>

        faq: `
          <details><summary>What is the difference between Gross and Net?</summary><p>Gross is the salary before taxes, Net is the amount the employee actually receives.</p></details>
          <details><summary>What is the income tax rate in 2026?</summary><p>In Georgia, the income tax is a flat rate of 20%.</p></details>
        `,
        seo: `
          <h2>How are salary taxes calculated in Georgia?</h2>
          <p>In Georgia, the main taxes for an employee are: <strong>Income tax 20%</strong> and <strong>Pension contribution 2%</strong>. Therefore, from the gross salary, the employee receives 78%.</p>
        `
      },
      ru: {
        title: "Калькулятор зарплаты",
        subtitle: "Грузия · Налоги 2026",
        tabEmp: "Сотрудник",
        tabSb: "Малый бизнес (1%)",
        tabEmpr: "Расходы работодателя",
        dirG2N: "Гросс → Нет",
        dirN2G: "Нет → Гросс",
        inputGross: "Введите зарплату Гросс (₾)",
        inputNet: "Введите желаемую сумму Нет (₾)",
        btnCalc: "Рассчитать",
        ad: "📢 Место для рекламы (AdSense)",
        share: "🔗 Поделиться с друзьями",
        shareAlert: "Ссылка скопирована!",
        saveBtn: "💾 Сохранить",
        pdfBtn: "📥 Скачать PDF",
        savedAlert: "Сохранено в историю!",
        historyTitle: "Сохраненные расчеты",
        clearBtn: "🗑️ Очистить историю",
        noHistory: "История пуста.",
        noteEmp: "Расчет: Подоходный налог 20% + Пенсия 2%. Итого на руки = Гросс × 0.78.",
        noteSb: "Статус малого бизнеса: 1% с оборота. Годовой лимит 500,000 ₾.",
        noteEmpr: "Расходы работодателя = Гросс + 2% пенсия (доля работодателя).",
        net: "На руки (Нет)",
        gross: "Зарплата Гросс",
        incTax: "Подоходный налог (20%)",
        pension: "Пенсия (2%)",
        totalDed: "Всего вычетов",
        reqGross: "Требуемый Гросс",
        turnover: "Оборот (Гросс)",
        tax1: "Налог (1%)",
        remaining: "Остаток (Нет)",
        totalCost: "Общие расходы",
        empNet: "На руки сотруднику",
        chartNet: "На руки (Нет)",
        chartTax: "Налоги",
        chartCost: "Доплата работодателя",
        curTitle: "Калькулятор валют",
        curSubtitle: "Живой курс (Национальный банк)",
        curLabel: "Введите сумму",
        curBtn: "Конвертировать",
        curError: "Не удалось загрузить курсы валют. Попробуйте позже.",
        faqTitle: "Часто задаваемые вопросы (FAQ)",
        faq: `
          <details><summary>В чем разница между Гросс и Нет?</summary><p>Гросс — это зарплата до вычета налогов, Нет — сумма, которую сотрудник фактически получает на руки.</p></details>
          <details><summary>Какова ставка подоходного налога в 2026 году?</summary><p>В Грузии подоходный налог составляет 20%.</p></details>
        `,
        seo: `
          <h2>Как рассчитываются налоги на зарплату в Грузии?</h2>
          <p>В Грузии основными налогами для сотрудника являются: <strong>подоходный налог 20%</strong> и <strong>пенсионный взнос 2%</strong>.</p>
        `
      }
    };

    let currentLang = localStorage.getItem('lang') || 'ka';
    let currentMode = 'employee';
    let isGrossToNet = true;
    let historyData = JSON.parse(localStorage.getItem('calcHistory')) || [];
    let currentResultData = null;
    let myChart = null;

    // API for exchange rates (Using a reliable free API that supports GEL)
    let exchangeRates = { GEL: 1, USD: 0.37, EUR: 0.34, GBP: 0.29, TRY: 13.5, RUB: 34.5 }; // Default fallback
    let ratesFetched = false;

    const amountInput = document.getElementById('amount');
    const calcBtn = document.getElementById('t-btn-calc');
    const resultBox = document.getElementById('result');
    const resultTotal = document.getElementById('resultTotal');
    const resultDetails = document.getElementById('resultDetails');
    const noteText = document.getElementById('noteText');
    const directionBtn = document.getElementById('directionBtn');
    const inputLabel = document.getElementById('t-input-label');
    const langSelect = document.getElementById('langSelect');
    const themeToggle = document.getElementById('themeToggle');
    const historyBox = document.getElementById('historyBox');
    const historyList = document.getElementById('historyList');
    
    function init() {
      langSelect.value = currentLang;
      applyLanguage(currentLang);
      renderHistory();
      
      if (localStorage.getItem('theme') === 'dark') {
        document.body.classList.add('dark-mode');
        themeToggle.textContent = '☀️';
      }
      
      fetchRates(); // Fetch currency rates on load
    }

    async function fetchRates() {
      try {
        // Using open.er-api.com which is free and doesn't require API keys
        const res = await fetch('https://open.er-api.com/v6/latest/GEL');
        const data = await res.json();
        if (data && data.rates) {
          exchangeRates = data.rates;
          ratesFetched = true;
        }
      } catch (e) {
        console.log("Using fallback rates", e);
      }
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      if (document.body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
        themeToggle.textContent = '☀️';
      } else {
        localStorage.setItem('theme', 'light');
        themeToggle.textContent = '🌙';
      }
      if (resultBox.classList.contains('show')) { calcBtn.click(); }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('lang', lang);
      applyLanguage(lang);
      resultBox.classList.remove('show');
      document.getElementById('curResult').classList.remove('show');
      renderHistory();
      if(myChart) { myChart.destroy(); myChart = null; }
    }

    function applyLanguage(lang) {
      const t = translations[lang];
      document.getElementById('t-title').textContent = t.title;
      document.getElementById('t-subtitle').textContent = t.subtitle;
      document.getElementById('t-tab-emp').textContent = t.tabEmp;
      document.getElementById('t-tab-sb').textContent = t.tabSb;
      document.getElementById('t-tab-empr').textContent = t.tabEmpr;
      document.getElementById('t-btn-calc').textContent = t.btnCalc;
      document.getElementById('t-ad').textContent = t.ad;
      document.getElementById('t-share').textContent = t.share;
      document.getElementById('t-save-btn').textContent = t.saveBtn;
      document.getElementById('t-pdf-btn').textContent = t.pdfBtn;
      document.getElementById('t-history-title').textContent = t.historyTitle;
      document.getElementById('t-clear-btn').textContent = t.clearBtn;
      
      // Currency translations
      document.getElementById('t-cur-title').textContent = t.curTitle;
      document.getElementById('t-cur-subtitle').textContent = t.curSubtitle;
      document.getElementById('t-cur-label').textContent = t.curLabel;
      document.getElementById('t-cur-btn').textContent = t.curBtn;
      
      const faqSec = document.getElementById('t-faq-section');
      faqSec.innerHTML = `<h2 style="text-align:center; margin-bottom:15px;">${t.faqTitle}</h2>` + t.faq;
      document.getElementById('t-seo-content').innerHTML = t.seo;
      
      updateUI();
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentMode = tab.dataset.mode;
        resultBox.classList.remove('show');
        if(myChart) { myChart.destroy(); myChart = null; }
        updateUI();
      });
    });

    directionBtn.addEventListener('click', () => {
      isGrossToNet = !isGrossToNet;
      resultBox.classList.remove('show');
      if(myChart) { myChart.destroy(); myChart = null; }
      updateUI();
    });

    function updateUI() {
      const t = translations[currentLang];
      directionBtn.textContent = isGrossToNet ? t.dirG2N : t.dirN2G;
      inputLabel.textContent = isGrossToNet ? t.inputGross : t.inputNet;
      const notes = { employee: t.noteEmp, smallbusiness: t.noteSb, employer: t.noteEmpr };
      noteText.textContent = notes[currentMode];
    }

    function renderChart(netAmount, taxAmount, labelNet, labelTax) {
      const ctx = document.getElementById('salaryChart').getContext('2d');
      document.getElementById('chartContainer').style.display = 'block';
      const isDark = document.body.classList.contains('dark-mode');
      const textColor = isDark ? '#f8fafc' : '#0f172a';

      if (myChart) { myChart.destroy(); }

      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: [labelNet, labelTax],
          datasets: [{
            data: [netAmount, taxAmount],
            backgroundColor: ['#22c55e', '#ef4444'],
            borderWidth: 2,
            borderColor: isDark ? '#1e293b' : '#ffffff'
          }]
        },
        options: {
          responsive: true,
          cutout: '70%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: textColor, font: { size: 12, family: 'Inter' } }
            }
          }
        }
      });
    }

    calcBtn.addEventListener('click', () => {
      const t = translations[currentLang];
      let val = parseFloat(amountInput.value);
      if (isNaN(val) || val <= 0) { alert(currentLang === 'ka' ? 'შეიყვანე სწორი თანხა' : (currentLang === 'en' ? 'Enter a valid amount' : 'Введите корректную сумму')); return; }

      let html = '';
      let gross = val;

      if (!isGrossToNet) {
        if (currentMode === 'employee') gross = val / 0.78;
        else if (currentMode === 'smallbusiness') gross = val / 0.99;
        else if (currentMode === 'employer') gross = val / 0.78;
      }

      if (currentMode === 'employee') {
        const incomeTax = gross * 0.20;
        const pension = gross * 0.02;
        const net = gross * 0.78;
        const totalTax = incomeTax + pension;
        
        resultTotal.textContent = isGrossToNet ? `${t.net}: ${net.toFixed(2)} ₾` : `${t.reqGross}: ${gross.toFixed(2)} ₾`;
        html = `
          <div class="result-row"><span>${t.gross}</span><span>${gross.toFixed(2)} ₾</span></div>
          <div class="result-row"><span>${t.incTax}</span><span style="color:#ef4444">− ${incomeTax.toFixed(2)} ₾</span></div>
          <div class="result-row"><span>${t.pension}</span><span style="color:#ef4444">− ${pension.toFixed(2)} ₾</span></div>
          <div class="result-row"><span>${t.totalDed}</span><span>${totalTax.toFixed(2)} ₾ (22%)</span></div>
          <div class="result-row" style="border-top: 1.5px solid var(--result-border); padding-top: 10px; margin-top: 5px;"><span>${t.net}</span><span style="font-size:1.2rem;">${net.toFixed(2)} ₾</span></div>`;
        
        renderChart(net, totalTax, t.chartNet, t.chartTax);
        currentResultData = { mode: t.tabEmp, input: val, output: net.toFixed(2), type: isGrossToNet ? 'Gross->Net' : 'Net->Gross' };
      
      } else if (currentMode === 'smallbusiness') {
        const tax = gross * 0.01;
        const net = gross * 0.99;
        
        resultTotal.textContent = isGrossToNet ? `${t.net}: ${net.toFixed(2)} ₾` : `${t.reqGross}: ${gross.toFixed(2)} ₾`;
        html = `
          <div class="result-row"><span>${t.turnover}</span><span>${gross.toFixed(2)} ₾</span></div>
          <div class="result-row"><span>${t.tax1}</span><span style="color:#ef4444">− ${tax.toFixed(2)} ₾</span></div>
          <div class="result-row" style="border-top: 1.5px solid var(--result-border); padding-top: 10px; margin-top: 5px;"><span>${t.remaining}</span><span style="font-size:1.2rem;">${net.toFixed(2)} ₾</span></div>`;
        
        renderChart(net, tax, t.chartNet, t.chartTax);
        currentResultData = { mode: t.tabSb, input: val, output: net.toFixed(2), type: isGrossToNet ? 'Gross->Net' : 'Net->Gross' };
      
      } else {
        const pension = gross * 0.02;
        const totalCost = gross + pension;
        const net = gross * 0.78;
        
        resultTotal.textContent = `${t.totalCost}: ${totalCost.toFixed(2)} ₾`;
        html = `
          <div class="result-row"><span>${t.gross}</span><span>${gross.toFixed(2)} ₾</span></div>
          <div class="result-row"><span>${t.pension} (Employer)</span><span>+ ${pension.toFixed(2)} ₾</span></div>
          <div class="result-row" style="border-top: 1.5px solid var(--result-border); padding-top: 10px; margin-top: 5px;"><span>${t.totalCost}</span><span style="font-size:1.2rem;">${totalCost.toFixed(2)} ₾</span></div>`;
        
        renderChart(gross, pension, t.gross, t.chartCost);
        currentResultData = { mode: t.tabEmpr, input: val, output: totalCost.toFixed(2), type: 'Cost' };
      }
      
      resultDetails.innerHTML = html;
      resultBox.classList.add('show');
    });

    // --- CURRENCY LOGIC ---
    function convertCurrency() {
      const t = translations[currentLang];
      const amount = parseFloat(document.getElementById('curAmount').value);
      const from = document.getElementById('curFrom').value;
      const to = document.getElementById('curTo').value;
      const resultBox = document.getElementById('curResult');

      if (isNaN(amount) || amount <= 0) {
        alert(currentLang === 'ka' ? 'შეიყვანე სწორი თანხა' : (currentLang === 'en' ? 'Enter a valid amount' : 'Введите корректную сумму'));
        return;
      }

      if (!ratesFetched && from !== 'GEL' && to !== 'GEL') {
          // If rates failed to load and cross-conversion is needed, alert
          // Fallback rates are available, so it will still calculate
      }

      // Convert to GEL first, then to target
      const amountInGEL = amount / exchangeRates[from];
      const finalAmount = amountInGEL * exchangeRates[to];

      const fromSymbol = document.getElementById('curFrom').options[document.getElementById('curFrom').selectedIndex].text;
      const toSymbol = document.getElementById('curTo').options[document.getElementById('curTo').selectedIndex].text;

      resultBox.innerHTML = `${amount} ${fromSymbol.split(' ')[0]} = <br><strong style="font-size:1.8rem; color:var(--btn-orange);">${finalAmount.toFixed(2)} ${toSymbol.split(' ')[0]}</strong>`;
      resultBox.classList.add('show');
    }

    function saveToHistory() {
      if (!currentResultData) return;
      const t = translations[currentLang];
      
      const newEntry = {
        id: Date.now(),
        date: new Date().toLocaleDateString(),
        mode: currentResultData.mode,
        input: currentResultData.input,
        output: currentResultData.output,
        type: currentResultData.type
      };
      
      historyData.unshift(newEntry);
      if (historyData.length > 10) historyData.pop();
      
      localStorage.setItem('calcHistory', JSON.stringify(historyData));
      renderHistory();
      alert(t.savedAlert);
    }

    function clearHistory() {
      historyData = [];
      localStorage.removeItem('calcHistory');
      renderHistory();
    }

    function renderHistory() {
      const t = translations[currentLang];
      historyList.innerHTML = '';
      
      if (historyData.length === 0) {
        historyList.innerHTML = `<p style="font-size:0.9rem; color:var(--subtitle-color); text-align:center;">${t.noHistory}</p>`;
        historyBox.classList.remove('show');
        return;
      }
      
      historyBox.classList.add('show');
      
      historyData.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <div>
            <strong>${item.mode}</strong><br>
            <span style="font-size:0.8rem; color:var(--subtitle-color);">${item.date}</span>
          </div>
          <div style="text-align:right;">
            <span>${item.input} ₾ ➔</span><br>
            <strong style="color:var(--btn-green);">${item.output} ₾</strong>
          </div>
        `;
        historyList.appendChild(div);
      });
    }

    function shareLink() {
      const t = translations[currentLang];
      const url = 'https://salary-calculator-five-sigma.vercel.app';
      if (navigator.share) {
        navigator.share({ title: t.title, url: url });
      } else {
        navigator.clipboard.writeText(url);
        alert(t.shareAlert);
      }
    }

    function downloadPDF() {
      const t = translations[currentLang];
      const tempDiv = document.createElement('div');
      tempDiv.style.padding = '30px';
      tempDiv.style.background = '#ffffff';
      tempDiv.style.color = '#0f172a';
      tempDiv.style.fontFamily = "'Inter', sans-serif";
      tempDiv.innerHTML = `
        <h2 style="color: #2563eb; text-align: center; margin-bottom: 10px;">${t.title}</h2>
        <p style="text-align: center; font-size: 14px; color: #64748b; margin-bottom: 30px;">${t.subtitle} | ${new Date().toLocaleDateString()}</p>
        <hr style="border: 1px solid #e2e8f0; margin-bottom: 30px;">
        <div style="font-size: 1.8rem; font-weight: 800; text-align: center; margin-bottom: 20px; color: #166534;">${resultTotal.textContent}</div>
        <div>${resultDetails.innerHTML}</div>
        <p style="text-align: center; font-size: 12px; color: #94a3b8; margin-top: 40px;">Generated via salary-calculator-five-sigma.vercel.app</p>
      `;
      
      tempDiv.querySelectorAll('.result-row').forEach(row => {
          row.style.color = '#0f172a';
          row.style.borderBottom = '1px dashed #cbd5e1';
          row.style.padding = '12px 0';
      });

      const opt = {
        margin:       0.5,
        filename:     'salary_calculation.pdf',
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      
      html2pdf().set(opt).from(tempDiv).save();
    }

    init();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js?v=3');
      });
    }
  </script>
</body>
</html>
